name: Deploy to GitHub Pages

# Publishes the app to https://<owner>.github.io/<repo>/ on every push to main.
# Needs, under Settings > Secrets and variables > Actions > Variables:
#   FSI_TENANT_ID, FSI_CLIENT_ID, FSI_SITE_URL, FSI_SETUP_ADMINS (optional, comma-separated)
#   FSI_TRACKER_FOLDER_URL, FSI_TRACKER_WORKBOOK (optional: connect the Relationship Tracker)
# and Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Write config.json from repository variables
        env:
          TENANT: ${{ vars.FSI_TENANT_ID }}
          CLIENT: ${{ vars.FSI_CLIENT_ID }}
          SITE: ${{ vars.FSI_SITE_URL }}
          ADMINS: ${{ vars.FSI_SETUP_ADMINS }}
          TRACKER: ${{ vars.FSI_TRACKER_FOLDER_URL }}
          TRACKER_BOOK: ${{ vars.FSI_TRACKER_WORKBOOK }}
        run: |
          node -e '
            const e = process.env;
            if (!e.TENANT || !e.CLIENT || !e.SITE) {
              console.error("Set the FSI_TENANT_ID, FSI_CLIENT_ID and FSI_SITE_URL repository variables.");
              process.exit(1);
            }
            const cfg = { tenantId: e.TENANT.trim(), clientId: e.CLIENT.trim(), siteUrl: e.SITE.trim() };
            if (e.ADMINS) cfg.setupAdmins = e.ADMINS.split(",").map((s) => s.trim()).filter(Boolean);
            if (e.TRACKER) cfg.trackerFolderUrl = e.TRACKER.trim();
            if (e.TRACKER_BOOK) cfg.trackerWorkbookName = e.TRACKER_BOOK.trim();
            const fs = require("fs");
            fs.mkdirSync("public", { recursive: true });
            fs.writeFileSync("public/config.json", JSON.stringify(cfg, null, 2));
          '
      - name: Build
        # Pages serves the site from /<repo>/, so build for that subpath.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
      - name: Serve the app for deep links
        # Pages has no rewrite rules; a 404 page that loads the app keeps /projects/12 links working.
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
